[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quicke-states"
version = "0.1.0"
description = "Verified, hardware-aware Dicke-state circuit synthesis and optimization for Cirq"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "DuQuantum" }]
urls = { Homepage = "https://github.com/wwwillott/quicke-states", Repository = "https://github.com/wwwillott/quicke-states", Issues = "https://github.com/wwwillott/quicke-states/issues" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cirq-core>=1.4,<2",
  "numpy>=1.26",
]

[project.optional-dependencies]
willow = ["cirq-google>=1.4,<2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]
notebooks = [
  "jupyter>=1.1",
  "ipykernel>=6",
]

[project.scripts]
quicke-states = "dicke_compiler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dicke_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
